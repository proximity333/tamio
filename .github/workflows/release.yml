# Pushing a tag "v<version>" builds the Mac disk image (Developer ID signed and
# notarized), signs it for Sparkle and writes the appcast, and publishes both as
# the latest release, with the version's section of CHANGELOG.md for its notes.
# The app's feed is the latest release's appcast.xml, so installed copies see
# the new version as soon as the run ends. Signing happens only here.
#
# Without the signing secrets, a tag is still built and published, ad hoc
# signed: the release notes tell the user how macOS lets it open. Sparkle
# updates need the EdDSA key, so the appcast then lists the update unsigned.
#
# A self-signed code signing certificate (MAC_SIGNING_P12 and
# MAC_SIGNING_P12_PASSWORD) is the middle ground: the signature stays the same
# across releases, which macOS's permission database (TCC) keys its grants on,
# so Desktop, Documents and the like survive an update. It is no Developer ID:
# the release is not notarized and the Mac app cannot sync with iCloud. Make
# the certificate once (Keychain Access → Certificate Assistant → Create a
# Certificate, Self Signed Root, Code Signing type), export it as a .p12, and
# set MAC_SIGNING_P12 to its base64 (`base64 -i cert.p12`) and
# MAC_SIGNING_P12_PASSWORD to its export password. A Developer ID certificate
# takes precedence when both are set.
#
# Run by hand (Actions → Release → Run workflow) it only builds, and keeps the
# products as artifacts of the run; without the secrets the Mac app is then
# signed ad hoc, which is enough to see that the build works.
#
# Secrets, set by Workflow/Scripts/release-secrets.sh:
#   DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD   the Developer ID Application
#                                                 certificate and its key
#   NOTARY_KEY, NOTARY_KEY_ID, NOTARY_ISSUER_ID   an App Store Connect API key
#   or NOTARY_APPLE_ID, NOTARY_PASSWORD           an Apple ID and an
#                                                 app-specific password
#   SPARKLE_PRIVATE_KEY                           the EdDSA key that signs
#                                                 updates (SUPublicEDKey is
#                                                 its public half)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the app's version
        if: env.IS_TAG == 'true'
        run: |
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \(.*\);/\1/p' Application/Tamio/Tamio.xcodeproj/project.pbxproj | head -1)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the app's version is $version. Set MARKETING_VERSION, or tag v$version."
            exit 1
          fi
          # Its notes, before half an hour of building: a release without them
          # is not built.
          bash Workflow/Scripts/release-notes.sh "$version" > /dev/null

      - name: Set up signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          MAC_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$DEVELOPER_ID_P12" && -n "${MAC_SIGNING_P12:-}" ]]; then
            # A self-signed code signing certificate (see the header): the
            # signature stays the same across releases, which keeps macOS's
            # permission grants; it cannot be notarized or carry iCloud.
            keychain="$RUNNER_TEMP/release.keychain-db"
            keychain_password="$(uuidgen)"
            printf '%s' "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MAC_SIGNING_P12_PASSWORD" \
              -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/certificate.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            # A self-signed root fails the trust check, so -v would hide it;
            # codesign signs with it regardless.
            identity="$(security find-identity -p codesigning "$keychain" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
            if [[ -z "$identity" ]]; then
              echo "::error::The imported certificate holds no code signing identity"
              exit 1
            fi
            echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
            echo "::warning::Signed with the repository's self-signed certificate: the release is not notarized, and the Mac app cannot sync with iCloud."
            exit 0
          fi
          if [[ -z "$DEVELOPER_ID_P12" ]]; then
            echo "::warning::No signing certificate in the repository's secrets: the Mac app is signed ad hoc, and users must clear the download's quarantine to open it."
            echo "CODE_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          # The certificate's issuers, which an exported .p12 may not carry.
          for name in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$name.cer" -o "$RUNNER_TEMP/$name.cer"
            security import "$RUNNER_TEMP/$name.cer" -k "$keychain" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -c "Developer ID Application" >/dev/null

          # With the app's Developer ID provisioning profile the Mac app can
          # sync with iCloud; without it the app is built as before. An App
          # Store Connect API key makes it, and the app id, as Xcode would.
          if [[ -n "$ASC_API_KEY_P8" ]]; then
            printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"
            swift Workflow/Scripts/asc-profile.swift "$RUNNER_TEMP/asc.p8" "$ASC_API_KEY_ID" "$ASC_API_ISSUER_ID" \
              sb.moe.tamio "$RUNNER_TEMP/Tamio.provisionprofile"
            echo "MAC_PROVISIONING_PROFILE=$RUNNER_TEMP/Tamio.provisionprofile" >> "$GITHUB_ENV"
          elif [[ -n "$MAC_PROFILE" ]]; then
            printf '%s' "$MAC_PROFILE" | base64 --decode > "$RUNNER_TEMP/Tamio.provisionprofile"
            echo "MAC_PROVISIONING_PROFILE=$RUNNER_TEMP/Tamio.provisionprofile" >> "$GITHUB_ENV"
          else
            echo "::warning::No provisioning profile in the repository's secrets: the Mac app cannot sync with iCloud."
          fi

          if [[ -n "$NOTARY_KEY" ]]; then
            printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
            {
              echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
              echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
            } >> "$GITHUB_ENV"
          elif [[ -n "$ASC_API_KEY_P8" ]]; then
            {
              echo "NOTARY_KEY_PATH=$RUNNER_TEMP/asc.p8"
              echo "NOTARY_KEY_ID=$ASC_API_KEY_ID"
              echo "NOTARY_ISSUER_ID=$ASC_API_ISSUER_ID"
            } >> "$GITHUB_ENV"
          elif [[ -n "$NOTARY_APPLE_ID" ]]; then
            echo "NOTARY_APPLE_ID=$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
          else
            echo "::warning::No notary credentials in the repository's secrets: the release is not notarized."
          fi
          if [[ -n "$NOTARY_KEY" || -n "$ASC_API_KEY_P8" || -n "$NOTARY_APPLE_ID" ]] && [[ "$IS_TAG" == true ]]; then
            echo "REQUIRE_NOTARIZATION=1" >> "$GITHUB_ENV"
          fi

      - name: Build the Mac disk image
        env:
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash Workflow/Scripts/release.sh mac

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: DerivedData/Release/*.log

      - name: Keep the products
        uses: actions/upload-artifact@v4
        with:
          name: Tamio
          path: DerivedData/Release/Tamio-*.dmg
          if-no-files-found: error

      - name: Write the appcast
        if: env.IS_TAG == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$SPARKLE_PRIVATE_KEY" ]]; then
            printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
            SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle.key" \
              bash Workflow/Scripts/appcast.sh DerivedData/Release/Tamio-*.dmg "$GITHUB_REF_NAME" \
              > DerivedData/Release/appcast.xml
          else
            bash Workflow/Scripts/appcast.sh DerivedData/Release/Tamio-*.dmg "$GITHUB_REF_NAME" \
              > DerivedData/Release/appcast.xml
          fi
          cat DerivedData/Release/appcast.xml

      - name: Verify the appcast
        if: env.IS_TAG == 'true'
        # Publishing an appcast the app cannot verify leaves every installed
        # copy unable to update, and only the pairing of the secret with the
        # key in Info.plist decides that. Check it before the release exists.
        run: bash Workflow/Scripts/verify-appcast.sh DerivedData/Release/Tamio-*.dmg DerivedData/Release/appcast.xml

      - name: Publish the release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash Workflow/Scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          # An ad hoc build carries no Developer ID signature or notarization:
          # tell the user how macOS lets it open, once, in its own notes.
          if [[ "${CODE_SIGN_IDENTITY:-}" == "-" ]]; then
            {
              echo
              echo "## 打开未签名版本"
              echo
              echo "这个 DMG 里的应用没有 Developer ID 签名，也没有经过 Apple 公证。下载解压拖入 Applications 后，首次打开会被 macOS 拦下。在终端运行一次："
              echo
              echo '```'
              echo "xattr -cr /Applications/Tamio.app"
              echo '```'
              echo
              echo "之后即可正常打开。"
            } >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" \
            DerivedData/Release/Tamio-*.dmg DerivedData/Release/appcast.xml \
            --latest --title "Tamio ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          {
            echo "### Released"
            if [[ "${CODE_SIGN_IDENTITY:-}" == "-" ]]; then
              echo "Tamio ${GITHUB_REF_NAME#v} is built ad hoc (unsigned) and published as the latest release."
            else
              echo "Tamio ${GITHUB_REF_NAME#v} is built, notarized, signed and published as the latest release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/Tamio.provisionprofile" "$RUNNER_TEMP/sparkle.key"
